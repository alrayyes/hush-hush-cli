version: 2

project_name: hush-hush-cli

before:
  hooks:
    - go mod download

builds:
  - id: hush-hush-cli
    main: ./cmd/hush-hush-cli
    binary: hush-hush-cli
    env:
      - CGO_ENABLED=0
    # The writer's and every consumer's own machine - a laptop or a CI
    # runner, any of the three major OSes.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Negligible real-world demand, and Go's own windows/arm64 support
      # is comparatively new next to the other five combinations here.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: hush-hush-cli
    ids: [hush-hush-cli]
    formats: [tar.gz]
    name_template: "hush-hush-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: LICENSE
        dst: LICENSE

# Distributed as release assets, same as the archive above - not a hosted
# apt/dnf repo, which would need its own signing key and publishing
# pipeline for no real gain over `dpkg -i`/`rpm -i` on a personal tool's
# release cadence.
#
# No man pages packaged yet - cmd/hush-hush-cli/man.go and the real
# command tree it walks have moved in from hush-hush (`hush-hush-cli man
# <dir>` works today), but the goreleaser wiring hasn't - tracked as
# hush-hush-cli#14. Once it lands, restore the
# `go run ./cmd/hush-hush-cli man manpages` before-hook and the six
# manpages/hush-hush-cli*.1 file entries hush-hush's own .goreleaser.yml
# carries, in both archives and nfpms below.
nfpms:
  - id: hush-hush-cli
    ids: [hush-hush-cli]
    package_name: hush-hush-cli
    formats: [deb, rpm]
    maintainer: Ryan Kes <alias+packages@ryankes.eu>
    description: Client for the hush-hush secrets object store
    homepage: https://github.com/alrayyes/hush-hush-cli
    license: GPL-3.0
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/hush-hush-cli/LICENSE

checksum:
  name_template: checksums.txt

# No dockers: block yet - tracked as hush-hush-cli#7 (refiled from
# hush-hush#152 when this repo split out).

# release-please already wrote the notes, curated from the same commits, and
# created the release carrying them. A second shortlog generated here would
# put them on twice, and `release.mode: replace` would throw the curated copy
# away — so the changelog is off and `release.mode` stays at its default,
# keep-existing. goreleaser is only hanging binaries on a release that exists.
changelog:
  disable: true
