# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

pre-commit:
  jobs:
    # golangci-lint fmt, not gofmt: .golangci.yml's formatters block runs
    # gofumpt/goimports/gci too, and CI's own `golangci-lint fmt --diff`
    # checks against all three - plain gofmt only covers the first.
    - name: golangci-lint fmt
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true

    - name: gomod
      glob: "go.mod"
      run: go mod edit -fmt go.mod
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: test
      run: go test ./...

    - name: golangci-lint run
      run: golangci-lint run ./...

    # No check-only flag on `go mod edit -fmt`, so the gate is running it
    # again and diffing. A no-op on a go.mod pre-commit already
    # canonicalized; only fails if that got bypassed.
    - name: gomod
      run: go mod edit -fmt go.mod && git diff --exit-code go.mod

    # A separate, broader check from the fmt gate above: catches a stale
    # require, a non-canonical version string, or a go.sum entry for
    # something nothing imports anymore - real drift `go build`/`go test`
    # never catches on their own (rules/go-mod.md).
    - name: gomod-tidy
      run: go mod tidy -diff

    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md
