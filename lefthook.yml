# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

# rules/linting.md: a passing hook prints nothing, a failing one prints why.
output:
  - failure

pre-commit:
  jobs:
    # golangci-lint fmt, not gofmt: .golangci.yml's formatters block runs
    # gofumpt/goimports/gci too, and CI's own `golangci-lint fmt --diff`
    # checks against all three - plain gofmt only covers the first.
    #
    # Docker-wrapped, like every other Go hook command below: a host go and
    # golangci-lint drifting apart independently is a real failure mode
    # (rules/go-mod.md), not a hypothetical. --user keeps the fixer's
    # writes owned by the invoking user, not root; the
    # GOCACHE/GOMODCACHE/GOLANGCI_LINT_CACHE mounts keep a second run from
    # paying a cold cache every time.
    - name: golangci-lint fmt
      glob: "*.go"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        -e GOLANGCI_LINT_CACHE=/lintcache -v "$HOME/.cache/golangci-lint-docker:/lintcache"
        golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
        golangci-lint fmt {staged_files}
      stage_fixed: true

    # go mod edit -fmt is the canonicalizer for go.mod itself: a builtin `go`
    # subcommand, not gofmt (which never touches go.mod) and not `go mod tidy`
    # (which does network resolution a formatting-only hook shouldn't be
    # doing). golang:<go.mod's own go directive>-bookworm, matching CI's pin
    # exactly.
    - name: gomod
      glob: "go.mod"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
        go mod edit -fmt go.mod
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    # Keeps package.json itself canonical the way Prettier does for
    # everything else (rules/javascript.md).
    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 --no-globs {staged_files}

    - name: vale
      glob: "*.md"
      run: ./scripts/lint-vale.sh {staged_files}

    # Pinned by digest rather than `latest`, like any other container image
    # (rules/dependencies.md applies to an image named in a hook command
    # just as much as one named in the Dockerfile itself). Each staged
    # Dockerfile is read from the index (`git show :file`), so an unstaged
    # edit to it can't fail or pass this commit. The whole-tree run, over
    # both Dockerfiles, is pre-push's hadolint job.
    - name: hadolint
      glob:
        - "Dockerfile"
        - "Dockerfile.release"
      run: >-
        for f in {staged_files}; do
        git show ":$f" | docker run --rm -i
        -v "$(pwd)/.hadolint.yaml:/.hadolint.yaml"
        hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        hadolint - || exit 1;
        done

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes. A hook rewriting files under a push leaves the
# pushed commit and the working tree disagreeing about what was reviewed -
# every job below runs in check mode, none of them --fix or -w.
pre-push:
  parallel: true
  jobs:
    # Same check as CI's goreleaser-check job (rules/go-releases.md), so a
    # broken .goreleaser.yml fails on the machine that wrote it. The version
    # matches the one CI's goreleaser-action installs.
    - name: goreleaser check
      glob:
        - ".goreleaser.y*ml"
        - "Dockerfile.release"
        - "manpages/**"
        - "*.go"
        - "go.mod"
        - "go.sum"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src -e HOME=/tmp
        goreleaser/goreleaser:v2.17.1@sha256:1098a0be4da1780f9616a85f4c5050447b53e3e74804d8017ec1e2bbb1fb697a
        check

    - name: test
      glob:
        - "*.go"
        - "go.mod"
        - "go.sum"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
        go test ./...

    # Boots the real, published hush-hush server image and drives
    # internal/cli's actual functions against it - internal/testserver's
    # fake is what `test` above exercises, this is the check on the fake's
    # own fidelity (rules/go-test.md: "The container/integration layer uses
    # testcontainers-go").
    #
    # Deliberately NOT Docker-wrapped, unlike every other Go job here:
    # testcontainers-go needs a real Docker daemon to pull and run against,
    # which the host already has - wrapping this command in another
    # container would need Docker-outside-of-Docker (mounting
    # /var/run/docker.sock into it) for no benefit over just not nesting,
    # the same reasoning ci.yml's own container-integration job gives for
    # staying off a `container:` runner.
    - name: container-integration
      glob:
        - "*.go"
        - "go.mod"
        - "go.sum"
      run: go test -tags=integration ./integration/... -v

    # No --fix here, unlike pre-commit's fixer above: pre-push checks,
    # it never writes (rules/linting.md). `golangci-lint run --fix` would
    # still run the full linter set to find what it can autofix - the same
    # cost as a pure check, so there's nothing this buys at push time that
    # pre-commit's own fixer hasn't already applied and restaged.
    - name: golangci-lint run
      glob:
        - "*.go"
        - "go.mod"
        - "go.sum"
        - ".golangci.yml"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        -e GOLANGCI_LINT_CACHE=/lintcache -v "$HOME/.cache/golangci-lint-docker:/lintcache"
        golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
        golangci-lint run ./...

    # No check-only flag on `go mod edit -fmt`, so the gate is running it
    # again and diffing. A no-op on a go.mod pre-commit already
    # canonicalized; only fails if that got bypassed. Only the edit itself
    # needs Docker - the mount is live, not a copy, so the diff check right
    # after runs against the host's own git same as any other pre-push job
    # here.
    - name: gomod
      glob:
        - "go.mod"
        - "go.sum"
        - "*.go"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
        go mod edit -fmt go.mod
        && git diff --exit-code go.mod

    # A separate, broader check from the fmt gate above: catches a stale
    # require, a non-canonical version string, or a go.sum entry for
    # something nothing imports anymore - real drift `go build`/`go test`
    # never catches on their own (rules/go-mod.md).
    - name: gomod-tidy
      glob:
        - "go.mod"
        - "go.sum"
        - "*.go"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
        go mod tidy -diff

    # Dependabot's bun updater only understands bun.lock lockfileVersion 1;
    # this has already regressed silently once (hush-hush-cli#42,
    # hush-hush-cli#44) when a routine `bun install` after a package.json
    # edit wrote version 2 again. Same check as ci.yml's `markdown` job.
    - name: bun.lock lockfileVersion
      glob:
        - "bun.lock"
        - "package.json"
      run: >-
        version="$(grep -m1 '"lockfileVersion"' bun.lock | grep -oE '[0-9]+')";
        [ "$version" = "1" ] || {
          echo "bun.lock lockfileVersion is $version, Dependabot's bun updater only supports 1 (hush-hush-cli#42)" >&2;
          exit 1;
        }

    # rules/dependencies.md: the ecosystem's own audit tool, separately
    # from whatever raises the update pull request.
    # GHSA-vfj7-8cjw-p6xm (braces) has no patched release yet; remove the
    # ignore once one ships (hush-hush-cli#166).
    - name: bun audit
      glob:
        - "bun.lock"
        - "package.json"
      run: bun audit --ignore GHSA-vfj7-8cjw-p6xm

    - name: prettier
      glob:
        - "*.{md,yml,yaml}"
        - "package.json"
        - "bun.lock"
        - ".prettier*"
      run: bun run format:check

    - name: sort-package-json
      glob:
        - "package.json"
      run: bunx sort-package-json --check package.json

    - name: markdownlint
      glob:
        - "*.md"
        - ".markdownlint-cli2.yaml"
        - "package.json"
        - "bun.lock"
      run: bun run lint:md

    - name: vale
      glob:
        - "*.md"
        - "styles/**"
        - ".vale.ini"
        - "scripts/lint-vale.sh"
      run: ./scripts/lint-vale.sh

    - name: ltex
      glob:
        - "*.md"
        - ".ltex.json"
        - "scripts/lint-ltex.sh"
      run: ./scripts/lint-ltex.sh

    - name: hadolint
      glob:
        - "Dockerfile"
        - "Dockerfile.release"
        - ".dockerignore"
        - ".hadolint.yaml"
      run: >-
        docker run --rm
        -v "$(pwd)/.hadolint.yaml:/.hadolint.yaml"
        -v "$(pwd)/Dockerfile:/Dockerfile"
        -v "$(pwd)/Dockerfile.release:/Dockerfile.release"
        hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        hadolint Dockerfile Dockerfile.release

    # Moved here from pre-commit: `go run` fetches actionlint over the
    # network and the check reads every workflow, neither of which belongs
    # in a hook that judges only the commit. CI's actionlint job runs the
    # same command.
    - name: actionlint
      glob:
        - ".github/workflows/*.{yml,yaml}"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
        go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

    # Same files as CI's docker-build job (scripts/changed-paths.sh).
    - name: docker build
      glob:
        - "Dockerfile"
        - ".dockerignore"
        - "*.go"
        - "go.mod"
        - "go.sum"
      run: docker build -t hush-hush-cli:pre-push-check -f Dockerfile .
