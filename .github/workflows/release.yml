# release-please decides the version and cuts the tag; goreleaser builds and
# attaches the binaries. A tag release-please pushes with the default
# GITHUB_TOKEN starts no further workflow (GitHub refuses, to stop recursive
# runs) — so goreleaser has to be a second job in this same workflow, gated
# on release-please's own `release_created` output, not a separate
# `on: push: tags:` workflow that would silently never fire.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # arm64 has no native runner here, so its image builds under QEMU
      # emulation - cheap now that Dockerfile.release only COPYs a binary
      # goreleaser already cross-compiled natively (go-releases.md), rather
      # than running `go build` itself under emulation.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Free SLSA Build L2 provenance tying these binaries to this workflow
      # run - releases.md: adopt unconditionally, no cosign/SBOM needed yet.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  # AUR_SSH_KEY exists to publish a package, not to touch this repo's own
  # git history - provisioned per the global CLAUDE.md's "added only once
  # a repo actually ships a PKGBUILD" convention back when PKGBUILD itself
  # was added. This pushes straight to the AUR, unconditionally, the same
  # way goreleaser's own job above publishes straight to GHCR; the
  # PKGBUILD bump this repo tracks lands through the ordinary pull request
  # below instead, same as every other change here (hush-hush-cli#71).
  # Release-triggered rather than a flake-lock-update.yml-style scheduled
  # job: a scheduled run could wait up to a week to notice a new release,
  # where this reacts the moment goreleaser's own job finishes.
  publish-aur:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:base-devel@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # git/openssh for the AUR push, github-cli for the pull request
      # below - none of them ship in archlinux:base-devel by default.
      - run: pacman -Sy --noconfirm git openssh github-cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}

      # This job runs as root inside `container:` - actions/checkout's own
      # dubious-ownership workaround doesn't reach the real $HOME later
      # steps (and scripts/publish-aur.sh's own git commands) inherit
      # (tooling.md). makepkg (called by the script, to regenerate
      # .SRCINFO) also refuses outright to run as root at all, hence the
      # builder user below and `su builder` on every later step - same
      # shape as washy-washy-cli's own publish-aur job.
      - name: Create a non-root builder
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # /home/builder explicitly, not ~ - this step runs as root, but the
      # Publish step below runs as builder via `su`, which uses builder's
      # own $HOME. Writing to root's ~/.ssh here would leave builder with
      # no key at all.
      - name: Configure the AUR deploy key
        run: |
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          echo "$AUR_SSH_KEY" > /home/builder/.ssh/aur-ci
          ssh-keyscan aur.archlinux.org >> /home/builder/.ssh/known_hosts 2>/dev/null
          {
            echo "Host aur.archlinux.org"
            echo "  IdentityFile ~/.ssh/aur-ci"
            echo "  User aur"
          } >> /home/builder/.ssh/config
          chmod 600 /home/builder/.ssh/aur-ci
          chown builder:builder /home/builder/.ssh/aur-ci /home/builder/.ssh/known_hosts /home/builder/.ssh/config
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      - name: Publish to the AUR
        run: su builder -c "VERSION=${TAG_NAME#v} bash scripts/publish-aur.sh"

      # The AUR push above is the real publish; this is only so the copy
      # this repo tracks doesn't drift from what's now live there.
      # RELEASE_TOKEN, not GITHUB_TOKEN - GitHub doesn't run pull_request
      # workflows off a plain GITHUB_TOKEN-authored branch either, the
      # same gap release-auto-merge.yml's own comment already covers for
      # the push side.
      #
      # chore(packaging), not fix(packaging) despite dependencies.md's
      # "ecosystems that ship in the released artifact get fix:" - this
      # commit doesn't change what ships; goreleaser's own job already
      # published the real artifact before this step ever runs, and the
      # AUR push above already made the real fix live. A fix: here would
      # be release-please-visible and always carry a real diff (pkgver
      # always changes to match the new tag), so every merge would queue
      # another release, which triggers another publish-aur run, which
      # opens another fix: bump PR - an unbounded release loop, confirmed
      # live: v1.5.1's bump PR (hush-hush-cli#79) queued v1.5.2 before
      # this was caught and its auto-merge disabled by hand.
      - name: Open a pull request with the same bump
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # tooling.md: a job that runs `git commit` itself needs this, so
          # lefthook doesn't fire against a commit nothing interactively
          # made in a container that carries none of its tooling.
          LEFTHOOK: 0
        run: |
          git diff --quiet -- PKGBUILD && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "aur/$TAG_NAME"
          git add PKGBUILD
          git commit -m "chore(packaging): bump AUR PKGBUILD to $TAG_NAME"
          git push origin "aur/$TAG_NAME"
          gh pr create \
            --title "chore(packaging): bump AUR PKGBUILD to $TAG_NAME" \
            --body "Recomputed checksums against the real $TAG_NAME release assets and pushed the same bump to the AUR (scripts/publish-aur.sh)." \
            --label dependencies \
            --base main
