# Dependabot has no built-in `automerge: true` the way Renovate does. This is
# that mechanism for a GitHub-primary repo: arm auto-merge the same way a
# human would from the UI, then let GitHub wait for the same checks every
# other pull request waits for.
#
# Every Dependabot PR gets this, not just patch/minor — GitHub's own
# auto-merge only ever completes a merge once checks are green, so a major
# bump that breaks CI just sits armed-but-blocked rather than merging
# broken. Per the standing CLAUDE.md exception ("merge one yourself once
# every check is green, no separate ask"), there's no separate gate on
# update-type layered on top of the green-check gate.
name: dependabot-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      # RELEASE_TOKEN, not the default GITHUB_TOKEN: a `github-actions`-app
      # token can never get a `workflows` permission (it isn't a grantable
      # key in a workflow's own `permissions:` block), and GitHub refuses
      # to enable auto-merge on any PR whose diff touches
      # .github/workflows/* without one - "refusing to allow a GitHub App
      # to create or update workflow ... without workflows permission
      # (enablePullRequestAutoMerge)", hit live on a github-actions
      # Dependabot group bump that only touched release.yml. Every
      # Dependabot PR here can touch a workflow file (the actions
      # ecosystem's whole job), so this needs the real PAT unconditionally,
      # not just for that one group - same fix release-auto-merge.yml
      # already uses, for its own, different reason.
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
