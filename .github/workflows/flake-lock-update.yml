# Dependabot has no `nix` package-ecosystem, so flake.lock can't be kept
# current the way go.sum/actions/bun already are (rules/dependencies.md's
# "bot coverage" - a pin gets nothing updated on its own unless something
# is actually watching it). This is that watcher, for the one ecosystem
# Dependabot can't reach.
name: flake-lock-update

on:
  schedule:
    # Same weekly Monday cadence dependabot.yml already uses for every
    # other ecosystem here, so a bump PR from any bot lands the same day.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          # fix:, not chore: - the flake ships to end users
          # (rules/releases.md: "ecosystems that ship in the released
          # artifact get a fix: commit-message prefix"), and this is
          # exactly that: a real change to what `nix run`/`nix build`
          # resolves.
          pr-title: "fix(nix): update flake.lock"
          commit-msg: "fix(nix): update flake.lock"
          pr-labels: dependencies
          # RELEASE_TOKEN, not the default GITHUB_TOKEN: this repo has
          # "Allow GitHub Actions to create and approve pull requests" off,
          # which blocks GITHUB_TOKEN from opening a PR outright (#45) -
          # same fix already proven on linkwarden-obsidian-sync and
          # scaffold-python-cli, using the same PAT this repo's own
          # release.yml/release-auto-merge.yml/dependabot-auto-merge.yml
          # already authenticate with.
          token: ${{ secrets.RELEASE_TOKEN }}
