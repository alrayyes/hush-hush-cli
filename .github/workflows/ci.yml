# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  lint:
    runs-on: ubuntu-24.04
    container:
      # Version-pinned by the image tag itself, so there's nothing separate
      # to keep in sync with a golangci-lint-action version - and this
      # sidesteps a real bug found live: golangci-lint-action's own
      # `config verify` preflight rejects this repo's `.golangci.yml`
      # (`additional properties 'exclusions' not allowed`) even though the
      # same config and the same golangci-lint version run this file clean
      # directly - confirmed on hush-hush-cli's first CI run. hush-hush's
      # own lint job already uses this direct-container shape for exactly
      # this reason.
      image: golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: golangci-lint fmt
        run: golangci-lint fmt --diff
      - name: golangci-lint run
        run: golangci-lint run

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tail -1 |
            awk '{ print "**Coverage: " $3 "**" }' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Dependabot PR doesn't get repo secrets by default (GitHub's
          # own restriction, not a misconfiguration here) - CODECOV_TOKEN
          # is empty on that run, and this repo's branch protection makes
          # Codecov refuse a tokenless upload. That's an upload hiccup on
          # an unprivileged run, not a real test regression.
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  hadolint:
    runs-on: ubuntu-24.04
    container:
      image: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    steps:
      # hadolint never shells out to git, so unlike every other job here it
      # doesn't need the safe.directory fix (or git installed at all).
      - run: apk add --no-cache nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: hadolint Dockerfile Dockerfile.release

  # hadolint reads the Dockerfile as text and never proves it actually
  # builds. Dockerfile.release gets that proof for free from `package`
  # below, once goreleaser's dockers: block runs as part of its snapshot
  # release - this job is only for the from-source Dockerfile, which
  # nothing else here ever builds (rules/containers.md).
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t hush-hush-cli:ci-check -f Dockerfile .

  # Boots the real, published server image via testcontainers-go and drives
  # internal/cli's actual functions against it - the layer neither `test`
  # above (internal/testserver's fake) nor a unit test reaches. Not run in
  # a `container:` job the way `lint`/`govulncheck` are: a nested container
  # job would need its own Docker-outside-of-Docker setup for no benefit
  # over just not nesting, the same reasoning hush-hush's own equivalent
  # job gives.
  container-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./integration/... -v

  gomod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod edit -fmt
        run: go mod edit -fmt go.mod && git diff --exit-code go.mod
      - name: go mod tidy -diff
        run: go mod tidy -diff

  govulncheck:
    runs-on: ubuntu-24.04
    container:
      image: golang:1.27-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  goreleaser-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: check

  # `goreleaser check` above only validates the config; this actually
  # builds the nfpm packages via a --snapshot release (no publish, no real
  # tag needed) and installs each into the distro it targets, so a broken
  # .deb/.rpm - a bad contents: path - fails here instead of on the first
  # real release.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=announce,publish

      - name: install and smoke-test the .deb
        run: |
          sudo dpkg -i dist/hush-hush-cli_*_linux_amd64.deb
          hush-hush-cli --version
          test -s /usr/share/man/man1/hush-hush-cli.1

      # No native rpm tooling on ubuntu-24.04 - a Fedora container is the
      # least-friction way to actually install and run the package, not
      # just inspect its file list. Plain fedora, not fedora-minimal: the
      # minimal image drops man pages on install the same way
      # debian/python's -slim variants do (rules/packaging.md), which
      # would pass this check either way and prove nothing.
      - name: install and smoke-test the .rpm
        run: |
          docker run --rm -v "$PWD/dist:/dist" \
            fedora@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d \
            sh -c '
              rpm -i /dist/hush-hush-cli_*_linux_amd64.rpm &&
              hush-hush-cli --version &&
              test -s /usr/share/man/man1/hush-hush-cli.1
            '

  # Catches a stale vendorHash or a broken derivation before it reaches a
  # release - flake.lock has no other check, since Dependabot has no nix
  # package-ecosystem. `nix flake check` covers packages/apps/devShells;
  # the explicit build + run after it is the same "prove it actually
  # works" step every other packaging format's CI job already does
  # (deb/rpm's install-and-run in `package` above).
  nix-flake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix flake check -L
      - run: nix build .#default -L
      - run: |
          ./result/bin/hush-hush-cli --version
          test -s ./result/share/man/man1/hush-hush-cli.1.gz

  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # Mechanics: grammar, spelling, the phonetic article. A right answer, so
  # this one gates rather than advises.
  grammar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus:18.7.0@sha256:22452e86a130e528d526b60792926002983fcbf732bff09bd4e843d22816e4ea
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-ltex.sh

  # Style: house voice, weasel words, corporate speak. Advice rather than a
  # verdict - MinAlertLevel in .vale.ini prints it, and only Vale.Terms
  # takes the job down.
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-vale.sh

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
