# The scan half of rules/dependencies.md (#281): audit main and keep one open
# "Dependency advisories" issue that lists what's there. Daily for advisories published against
# pins that haven't moved, on a lockfile push so a merged fix closes the ticket at once, and by
# hand. An audit that errors (registry down) fails the job and leaves the ticket alone.
name: advisory-scan

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - package.json
      - bun.lock
      - .github/workflows/advisory-scan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Pinned to a main commit of alrayyes/advisory-scan until its first release; re-pin then.
      # Both ecosystems in one step, so the repo keeps one ticket and neither audit closes the other's.
      - uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68
        with:
          mode: scan
          command: |
            rc=0
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... || rc=1
            bun audit || rc=1
            exit "$rc"
          labels: dependencies
