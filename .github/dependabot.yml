# Dependabot raises the pull request; CI decides whether it lands.
# Everything here is pinned to an exact version, which is the whole reason
# this works — a floating range drifts silently and there's nothing to raise
# a pull request about.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      go-dependencies-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

  # The base images in Dockerfile and Dockerfile.release are pinned by tag and
  # digest, which nothing else watches. They ship in the published image, so
  # a bump is a `fix`, like a Go dependency.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: fix
      include: scope
    groups:
      docker-images:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-images-major:
        patterns: ["*"]
        update-types: [major]

  # Nothing here is JavaScript. package.json exists so commitlint can
  # resolve the shared config it extends, which bunx alone cannot do.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]
      tooling-major:
        patterns: ["*"]
        update-types: [major]
